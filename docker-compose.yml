version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16.8
    container_name: contact_management_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contact_management_backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - backend_photos:/app/photos
    depends_on:
      db:
        condition: service_healthy

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_PORT: ${BACKEND_PORT}
    container_name: contact_management_frontend
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${FRONTEND_PORT}:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  backend_photos:
    driver: local
